# T3-6a demo mode: lets the demo tunnel reach Reverb through Herd's nginx.
#
# Installed by scripts/demo-mode.ps1 (`on`) as Herd's server_snippets/tea-alley-reverb.conf and
# removed again by `off`. Herd includes every server snippet in EVERY site it serves, hence the
# host check. {{HERD_CA}} is replaced with the path of Herd's CA certificate on install.
#
# Only /app/ (Reverb's WebSocket endpoint) is proxied, never /apps/ (Reverb's HTTP API, which
# Laravel reaches directly on 127.0.0.1:8080). Reverb serves TLS with Herd's certificate for
# tea-alley.test, which nginx verifies against Herd's CA instead of turning verification off.

location ^~ /app/ {
    if ($host != "tea-alley.test") {
        return 404;
    }

    proxy_pass https://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host tea-alley.test;

    proxy_ssl_server_name on;
    proxy_ssl_name tea-alley.test;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate "{{HERD_CA}}";

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
