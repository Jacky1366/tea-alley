# T3-6a demo mode: Herd server snippet for tea-alley.test behind the demo tunnel.
#
# Installed by scripts/demo-mode.ps1 (`on`) as Herd's server_snippets/tea-alley-demo.conf and
# removed again by `off`. Herd includes every server snippet in EVERY server block of EVERY
# site, so everything here is limited to the tea-alley.test host. {{HERD_CA}} is replaced with
# the path of Herd's CA certificate on install.

# 1. Herd Studio stays private. Herd 2 keeps serving /herd-studio/loader.js and proxying
#    /__herd/ai/ws (its AI agent's socket) even with Herd Studio switched off, and rewrites that
#    proxy on every start, so the tunnel would publish them. This runs in the server's rewrite
#    phase, before any location (Herd's exact `location = /__herd/ai/ws` included) is chosen.
#    $uri is decoded and slash-merged (unlike $request_uri), so /%5F%5Fherd/... and //__herd/...
#    are caught too; ~* because nginx on Windows matches locations case-insensitively.
#    nginx's `if` can't combine conditions, hence the variable.
set $tea_alley_demo_block "";
if ($host = "tea-alley.test") {
    set $tea_alley_demo_block "host";
}
if ($uri ~* "^/+(__herd|herd-studio)(/|$)") {
    set $tea_alley_demo_block "${tea_alley_demo_block}+path";
}
# With a body: a bare `return 404` goes through Herd's `error_page 404`, which points at a file
# path and turns it into a 302 whose Location is Herd's install path.
if ($tea_alley_demo_block = "host+path") {
    return 404 "Not Found";
}

# 2. Reverb's WebSocket endpoint through the same tunnel. Only /app/, never /apps/ (Reverb's
#    HTTP API, which Laravel reaches directly on 127.0.0.1:8080). Reverb serves TLS with Herd's
#    certificate for tea-alley.test, which nginx verifies against Herd's CA instead of turning
#    verification off.
location ^~ /app/ {
    if ($host != "tea-alley.test") {
        return 404 "Not Found";
    }

    proxy_pass https://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host tea-alley.test;

    proxy_ssl_server_name on;
    proxy_ssl_name tea-alley.test;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate "{{HERD_CA}}";

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
